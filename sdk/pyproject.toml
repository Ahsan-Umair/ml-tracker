[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-lab-client"
version = "1.1.0"
description = "A small, dependency-free client for your personal Model Lab workspace"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["model_lab*"]
