name: Model Lab checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      COOKIE_SECURE: "false"
      FRONTEND_ORIGINS: http://localhost:3000
      API_ORIGIN: http://127.0.0.1:8000
      LOCAL_DATABASE_PATH: /tmp/model-lab-ci.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m unittest discover -s tests -v
        working-directory: sdk
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run typecheck && npm run lint && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser and API integration
        shell: bash
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/model-lab-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run start > /tmp/model-lab-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/api/ready > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/ready > /dev/null
          PYTHONPATH=sdk MODEL_LAB_INTEGRATION_URL=http://localhost:3000 python -m unittest discover -s sdk/tests -p test_integration.py -v
          npm --prefix frontend run test:e2e
